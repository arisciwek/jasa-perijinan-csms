<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Target bullseye -->
  <g transform="translate(200, 100)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#dbeafe" stroke-width="3"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#93c5fd" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#3b82f6"/>
    <circle cx="0" cy="0" r="5" fill="#fff"/>
  </g>
  <!-- Arrow hitting center -->
  <g transform="translate(200, 100)">
    <path d="M-60,60 L-15,15" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="-15,15 -5,10 -5,20" fill="#10b981"/>
  </g>
  <!-- KPI cards -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="85" height="60" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="42.5" y="20" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="bold">LTIFR</text>
    <text x="42.5" y="40" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="bold">0.0</text>
    <text x="42.5" y="55" text-anchor="middle" font-size="8" fill="#10b981">Target ✓</text>
  </g>
  <g transform="translate(155, 200)">
    <rect x="0" y="0" width="85" height="60" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="42.5" y="20" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="bold">TRIR</text>
    <text x="42.5" y="40" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="bold">0.5</text>
    <text x="42.5" y="55" text-anchor="middle" font-size="8" fill="#10b981">Target ✓</text>
  </g>
  <g transform="translate(250, 200)">
    <rect x="0" y="0" width="85" height="60" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="42.5" y="20" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="bold">Near Miss</text>
    <text x="42.5" y="40" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="bold">47</text>
    <text x="42.5" y="55" text-anchor="middle" font-size="8" fill="#f59e0b">Reported</text>
  </g>
  <!-- Document with chart -->
  <g transform="translate(280, 50)">
    <rect x="0" y="0" width="70" height="90" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M10,75 L20,55 L30,65 L40,40 L50,50 L60,30" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="55" r="3" fill="#3b82f6"/>
    <circle cx="30" cy="65" r="3" fill="#3b82f6"/>
    <circle cx="40" cy="40" r="3" fill="#10b981"/>
    <circle cx="50" cy="50" r="3" fill="#3b82f6"/>
    <circle cx="60" cy="30" r="3" fill="#10b981"/>
  </g>
</svg>