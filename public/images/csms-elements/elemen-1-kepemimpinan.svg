<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Leader figure -->
  <g transform="translate(200, 80)">
    <circle cx="0" cy="0" r="35" fill="url(#primaryGrad)" opacity="0.15"/>
    <circle cx="0" cy="-10" r="20" fill="#3b82f6"/>
    <ellipse cx="0" cy="35" rx="25" ry="18" fill="#3b82f6" opacity="0.2"/>
  </g>
  <!-- Team members -->
  <g transform="translate(100, 180)">
    <circle cx="0" cy="0" r="18" fill="#93c5fd"/>
    <ellipse cx="0" cy="28" rx="20" ry="15" fill="#93c5fd" opacity="0.3"/>
  </g>
  <g transform="translate(200, 180)">
    <circle cx="0" cy="0" r="18" fill="#93c5fd"/>
    <ellipse cx="0" cy="28" rx="20" ry="15" fill="#93c5fd" opacity="0.3"/>
  </g>
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="18" fill="#93c5fd"/>
    <ellipse cx="0" cy="28" rx="20" ry="15" fill="#93c5fd" opacity="0.3"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" opacity="0.5">
    <path d="M115 100 Q150 130 185 100"/>
    <path d="M215 100 Q200 130 285 100"/>
  </g>
  <!-- Document/badge -->
  <g transform="translate(200, 240)">
    <rect x="-40" y="0" width="80" height="50" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="-30" y="8" width="60" height="8" rx="2" fill="#3b82f6"/>
    <rect x="-30" y="20" width="40" height="6" rx="2" fill="#93c5fd"/>
    <rect x="-30" y="30" width="50" height="6" rx="2" fill="#93c5fd"/>
    <rect x="-30" y="40" width="30" height="6" rx="2" fill="#dbeafe"/>
  </g>
  <!-- Shield badge -->
  <g transform="translate(320, 60)">
    <path d="M0,-20 L15,-10 L15,15 L0,25 L-15,15 L-15,-10 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">✓</text>
  </g>
  <text x="320" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Commitment</text>
</svg>