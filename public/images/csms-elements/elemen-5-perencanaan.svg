<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Document stack with procedures -->
  <g transform="translate(200, 80)">
    <g transform="translate(-60, 0)">
      <rect x="0" y="0" width="120" height="140" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
      <rect x="8" y="8" width="104" height="10" rx="2" fill="#3b82f6"/>
      <rect x="8" y="22" width="80" height="6" rx="2" fill="#93c5fd"/>
      <rect x="8" y="32" width="100" height="6" rx="2" fill="#dbeafe"/>
      <rect x="8" y="42" width="90" height="6" rx="2" fill="#dbeafe"/>
      <rect x="8" y="52" width="70" height="6" rx="2" fill="#dbeafe"/>
      <rect x="8" y="62" width="100" height="6" rx="2" fill="#dbeafe"/>
      <text x="60" y="120" text-anchor="middle" font-size="9" fill="#64748b">SOP/SWP</text>
    </g>
    <g transform="translate(-50, 10)">
      <rect x="0" y="0" width="120" height="140" rx="5" fill="#fff" stroke="#10b981" stroke-width="2"/>
      <rect x="8" y="8" width="104" height="10" rx="2" fill="#10b981"/>
      <rect x="8" y="22" width="70" height="6" rx="2" fill="#6ee7b7"/>
      <text x="60" y="120" text-anchor="middle" font-size="9" fill="#64748b">PTW</text>
    </g>
    <g transform="translate(-40, 20)">
      <rect x="0" y="0" width="120" height="140" rx="5" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
      <rect x="8" y="8" width="104" height="10" rx="2" fill="#f59e0b"/>
      <rect x="8" y="22" width="80" height="6" rx="2" fill="#fde68a"/>
      <text x="60" y="120" text-anchor="middle" font-size="9" fill="#64748b">ERP</text>
    </g>
    <g transform="translate(-30, 30)">
      <rect x="0" y="0" width="120" height="140" rx="5" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="8" y="8" width="104" height="10" rx="2" fill="#8b5cf6"/>
      <rect x="8" y="22" width="60" height="6" rx="2" fill="#d8b4fe"/>
      <text x="60" y="120" text-anchor="middle" font-size="9" fill="#64748b">MOC</text>
    </g>
  </g>
  <!-- PTW Flow -->
  <g transform="translate(50, 230)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1e293b">Permit to Work Flow</text>
    <g transform="translate(0, 20)">
      <g font-size="9" fill="#1e293b">
        <rect x="0" y="-5" width="55" height="18" rx="4" fill="#dbeafe"/>
        <text x="27.5" y="5" text-anchor="middle">Request</text>
        <text x="65" y="5">→</text>
        <rect x="75" y="-5" width="55" height="18" rx="4" fill="#fef3c7"/>
        <text x="102.5" y="5" text-anchor="middle">Risk Assess</text>
        <text x="138" y="5">→</text>
        <rect x="148" y="-5" width="55" height="18" rx="4" fill="#dcfce7"/>
        <text x="175.5" y="5" text-anchor="middle">Approve</text>
        <text x="210" y="5">→</text>
        <rect x="220" y="-5" width="55" height="18" rx="4" fill="#fce7f3"/>
        <text x="247.5" y="5" text-anchor="middle">Execute</text>
        <text x="282" y="5">→</text>
        <rect x="292" y="-5" width="55" height="18" rx="4" fill="#e0e7ff"/>
        <text x="319.5" y="5" text-anchor="middle">Close</text>
      </g>
    </g>
  </g>
</svg>