<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Inspection checklist -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#1e293b">Inspection Checklist</text>
    <g transform="translate(0, 25)">
      <g font-size="10" fill="#1e293b">
        <rect x="0" y="0" width="20" height="20" rx="3" fill="#3b82f6"/>
        <text x="10" y="14" text-anchor="middle" font-size="11" fill="#fff">✓</text>
        <text x="30" y="15">Daily Safety Walk</text>
        <text x="250" y="15" fill="#10b981">Done</text>
      </g>
      <g transform="translate(0, 30)" font-size="10" fill="#1e293b">
        <rect x="0" y="0" width="20" height="20" rx="3" fill="#3b82f6"/>
        <text x="10" y="14" text-anchor="middle" font-size="11" fill="#fff">✓</text>
        <text x="30" y="15">Weekly HSE Inspection</text>
        <text x="250" y="15" fill="#10b981">Done</text>
      </g>
      <g transform="translate(0, 60)" font-size="10" fill="#1e293b">
        <rect x="0" y="0" width="20" height="20" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
        <text x="30" y="15">Monthly Management Audit</text>
        <text x="250" y="15" fill="#f59e0b">Pending</text>
      </g>
      <g transform="translate(0, 90)" font-size="10" fill="#1e293b">
        <rect x="0" y="0" width="20" height="20" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
        <text x="30" y="15">BBS Observation (Target: 20/bln)</text>
        <text x="250" y="15" fill="#3b82f6">12/20</text>
      </g>
    </g>
  </g>
  <!-- Environmental monitoring -->
  <g transform="translate(50, 210)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1e293b">Environmental Monitoring</text>
    <g transform="translate(0, 20)">
      <g font-size="9" fill="#1e293b">
        <rect x="0" y="0" width="70" height="35" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
        <text x="35" y="15" text-anchor="middle" font-weight="bold">Noise</text>
        <text x="35" y="28" text-anchor="middle" fill="#10b981">82 dB ✓</text>
      </g>
      <g transform="translate(80, 0)" font-size="9" fill="#1e293b">
        <rect x="0" y="0" width="70" height="35" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
        <text x="35" y="15" text-anchor="middle" font-weight="bold">Dust</text>
        <text x="35" y="28" text-anchor="middle" fill="#10b981">2.1 mg/m³ ✓</text>
      </g>
      <g transform="translate(160, 0)" font-size="9" fill="#1e293b">
        <rect x="0" y="0" width="70" height="35" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
        <text x="35" y="15" text-anchor="middle" font-weight="bold">H₂S</text>
        <text x="35" y="28" text-anchor="middle" fill="#10b981">0 ppm ✓</text>
      </g>
      <g transform="translate(240, 0)" font-size="9" fill="#1e293b">
        <rect x="0" y="0" width="70" height="35" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
        <text x="35" y="15" text-anchor="middle" font-weight="bold">Heat</text>
        <text x="35" y="28" text-anchor="middle" fill="#f59e0b">31°C ⚠</text>
      </g>
    </g>
  </g>
  <!-- Incident reporting -->
  <g transform="translate(280, 40)">
    <rect x="0" y="0" width="70" height="100" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="35" y="20" text-anchor="middle" font-size="9" font-weight="bold" fill="#3b82f6">Incident Log</text>
    <g transform="translate(10, 30)" font-size="8" fill="#1e293b">
      <text x="0" y="0">LTI: 0</text>
      <text x="0" y="15">MTI: 1</text>
      <text x="0" y="30">RWI: 2</text>
      <text x="0" y="45">Near Miss: 15</text>
      <text x="0" y="60" fill="#10b981">All Investigated</text>
    </g>
  </g>
</svg>