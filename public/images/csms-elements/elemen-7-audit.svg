<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Audit types -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#1e293b">Audit Program</text>
    <g transform="translate(0, 25)">
      <g font-size="10" fill="#1e293b">
        <rect x="0" y="0" width="140" height="50" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
        <text x="70" y="18" text-anchor="middle" font-weight="bold" fill="#3b82f6">Internal Audit</text>
        <text x="70" y="34" text-anchor="middle" font-size="9" fill="#64748b">Quarterly</text>
        <text x="70" y="44" text-anchor="middle" fill="#10b981">✓ Completed</text>
      </g>
      <g transform="translate(160, 0)" font-size="10" fill="#1e293b">
        <rect x="0" y="0" width="140" height="50" rx="6" fill="#fff" stroke="#10b981" stroke-width="2"/>
        <text x="70" y="18" text-anchor="middle" font-weight="bold" fill="#10b981">3rd Party Audit</text>
        <text x="70" y="34" text-anchor="middle" font-size="9" fill="#64748b">Annual</text>
        <text x="70" y="44" text-anchor="middle" fill="#f59e0b">Scheduled</text>
      </g>
      <g transform="translate(0, 70)" font-size="10" fill="#1e293b">
        <rect x="0" y="0" width="140" height="50" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
        <text x="70" y="18" text-anchor="middle" font-weight="bold" fill="#f59e0b">Principal Verify</text>
        <text x="70" y="34" text-anchor="middle" font-size="9" fill="#64748b">Per Contract</text>
        <text x="70" y="44" text-anchor="middle" fill="#3b82f6">Preparing</text>
      </g>
      <g transform="translate(160, 70)" font-size="10" fill="#1e293b">
        <rect x="0" y="0" width="140" height="50" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
        <text x="70" y="18" text-anchor="middle" font-weight="bold" fill="#8b5cf6">Surveillance</text>
        <text x="70" y="34" text-anchor="middle" font-size="9" fill="#64748b">Semi-Annual</text>
        <text x="70" y="44" text-anchor="middle" fill="#10b981">✓ Passed</text>
      </g>
    </g>
  </g>
  <!-- Management Review Meeting -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1e293b">Management Review Meeting</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="300" height="70" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <g transform="translate(15, 15)" font-size="9" fill="#1e293b">
        <text x="0" y="0">▸ KPI Review: LTIFR, TRIR, Near Miss Trends</text>
        <text x="0" y="16">▸ Audit Findings: 3 NC, 5 OFI → All Closed</text>
        <text x="0" y="32">▸ Resource Adequacy: Budget 105%, Staffing OK</text>
        <text x="0" y="48">▸ Decisions: New SOP, HSE Officer Training, ERP Drill</text>
      </g>
    </g>
  </g>
  <!-- CAP Tracking -->
  <g transform="translate(280, 40)">
    <rect x="0" y="0" width="70" height="150" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="35" y="20" text-anchor="middle" font-size="9" font-weight="bold" fill="#f59e0b">CAP Status</text>
    <g transform="translate(10, 30)" font-size="8" fill="#1e293b">
      <rect x="0" y="0" width="50" height="18" rx="3" fill="#fee2e2"/>
      <text x="25" y="12" text-anchor="middle" font-size="7" fill="#dc2626">Open: 3</text>
      <rect x="0" y="25" width="50" height="18" rx="3" fill="#fef3c7"/>
      <text x="25" y="37" text-anchor="middle" font-size="7" fill="#d97706">In Progress: 5</text>
      <rect x="0" y="50" width="50" height="18" rx="3" fill="#dcfce7"/>
      <text x="25" y="62" text-anchor="middle" font-size="7" fill="#16a34a">Closed: 12</text>
      <rect x="0" y="75" width="50" height="18" rx="3" fill="#dbeafe"/>
      <text x="25" y="87" text-anchor="middle" font-size="7" fill="#3b82f6">Verified: 12</text>
    </g>
  </g>
</svg>