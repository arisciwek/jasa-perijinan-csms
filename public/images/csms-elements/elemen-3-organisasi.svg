<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Org chart -->
  <g transform="translate(200, 50)">
    <!-- Top level -->
    <rect x="-50" y="-20" width="100" height="40" rx="6" fill="#3b82f6"/>
    <text x="0" y="8" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Direktur</text>
    <!-- Lines down -->
    <g stroke="#3b82f6" stroke-width="2">
      <path d="M0,20 L0,40"/>
      <path d="M-40,20 L-80,50"/>
      <path d="M40,20 L80,50"/>
    </g>
    <!-- Middle level -->
    <g transform="translate(-80, 50)">
      <rect x="-40" y="0" width="80" height="35" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="bold">HSE Manager</text>
      <text x="0" y="26" text-anchor="middle" font-size="8" fill="#64748b">AK3 Umum</text>
    </g>
    <g transform="translate(80, 50)">
      <rect x="-40" y="0" width="80" height="35" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="bold">Ops Manager</text>
    </g>
    <g transform="translate(0, 50)">
      <rect x="-40" y="0" width="80" height="35" rx="5" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
      <text x="0" y="14" text-anchor="middle" font-size="10" fill="#10b981" font-weight="bold">K3LL Coord</text>
      <text x="0" y="26" text-anchor="middle" font-size="8" fill="#64748b">AK3 Pelaksana</text>
    </g>
    <!-- Lines to bottom -->
    <g stroke="#3b82f6" stroke-width="1.5" opacity="0.5">
      <path d="M-80,85 L-100,115"/>
      <path d="M-80,85 L-60,115"/>
      <path d="M80,85 L60,115"/>
      <path d="M80,85 L100,115"/>
    </g>
    <!-- Bottom level -->
    <g transform="translate(-100, 115)">
      <rect x="-30" y="0" width="60" height="30" rx="4" fill="#e0e7ff"/>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#3730a3">Supervisor</text>
    </g>
    <g transform="translate(-60, 115)">
      <rect x="-30" y="0" width="60" height="30" rx="4" fill="#e0e7ff"/>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#3730a3">Supervisor</text>
    </g>
    <g transform="translate(60, 115)">
      <rect x="-30" y="0" width="60" height="30" rx="4" fill="#e0e7ff"/>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#3730a3">Supervisor</text>
    </g>
    <g transform="translate(100, 115)">
      <rect x="-30" y="0" width="60" height="30" rx="4" fill="#e0e7ff"/>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#3730a3">Supervisor</text>
    </g>
  </g>
  <!-- RACI legend -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="300" height="50" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
    <text x="20" y="20" font-size="11" font-weight="bold" fill="#1e293b">RACI Matrix:</text>
    <g transform="translate(120, 15)">
      <rect x="0" y="0" width="24" height="16" rx="3" fill="#3b82f6"/>
      <text x="12" y="12" text-anchor="middle" font-size="9" fill="#fff">R</text>
      <text x="50" y="12" font-size="9" fill="#64748b">Responsible</text>
    </g>
    <g transform="translate(220, 15)">
      <rect x="0" y="0" width="24" height="16" rx="3" fill="#10b981"/>
      <text x="12" y="12" text-anchor="middle" font-size="9" fill="#fff">A</text>
      <text x="50" y="12" font-size="9" fill="#64748b">Accountable</text>
    </g>
  </g>
</svg>