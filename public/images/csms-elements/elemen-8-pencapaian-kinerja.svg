<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Performance charts -->
  <g transform="translate(50, 30)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#1e293b">KPI Dashboard</text>
    <g transform="translate(0, 25)">
      <!-- LTIFR trend -->
      <rect x="0" y="0" width="140" height="120" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="70" y="15" text-anchor="middle" font-size="9" font-weight="bold" fill="#3b82f6">LTIFR Trend</text>
      <g transform="translate(10, 25)" font-size="8" fill="#1e293b">
        <path d="M0,85 L20,70 L40,75 L60,60 L80,65 L100,50 L120,45" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="85" r="3" fill="#3b82f6"/>
        <circle cx="20" cy="70" r="3" fill="#3b82f6"/>
        <circle cx="40" cy="75" r="3" fill="#3b82f6"/>
        <circle cx="60" cy="60" r="3" fill="#10b981"/>
        <circle cx="80" cy="65" r="3" fill="#10b981"/>
        <circle cx="100" cy="50" r="3" fill="#10b981"/>
        <circle cx="120" cy="45" r="3" fill="#10b981"/>
      </g>
      <text x="70" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#10b981">0.0</text>
      <!-- TRIR trend -->
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="140" height="120" rx="6" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
        <text x="70" y="15" text-anchor="middle" font-size="9" font-weight="bold" fill="#10b981">TRIR Trend</text>
        <g transform="translate(10, 25)" font-size="8" fill="#1e293b">
          <path d="M0,60 L20,55 L40,58 L60,50 L80,48 L100,42 L120,38" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="0" cy="60" r="3" fill="#10b981"/>
          <circle cx="20" cy="55" r="3" fill="#10b981"/>
          <circle cx="40" cy="58" r="3" fill="#f59e0b"/>
          <circle cx="60" cy="50" r="3" fill="#10b981"/>
          <circle cx="80" cy="48" r="3" fill="#10b981"/>
          <circle cx="100" cy="42" r="3" fill="#10b981"/>
          <circle cx="120" cy="38" r="3" fill="#10b981"/>
        </g>
        <text x="70" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#10b981">0.4</text>
      </g>
    </g>
    <g transform="translate(0, 160)">
      <!-- Monthly stats -->
      <rect x="0" y="0" width="300" height="80" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="150" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#3b82f6">Monthly Statistics (Current Year)</text>
      <g transform="translate(20, 25)" font-size="9" fill="#1e293b">
        <text x="0" y="0">Man-Hours: 2,450,000</text>
        <text x="0" y="15">Training Hours: 8,420</text>
        <text x="0" y="30">Inspections: 342</text>
        <text x="0" y="45">Observations: 156</text>
        <text x="0" y="60">Hazard Reports: 89</text>
      </g>
      <g transform="translate(170, 25)" font-size="9" fill="#1e293b">
        <text x="0" y="0">LTI: 0</text>
        <text x="0" y="15">MTI: 1</text>
        <text x="0" y="30">RWI: 2</text>
        <text x="0" y="45">FAC: 0</text>
        <text x="0" y="60">Near Miss: 47</text>
      </g>
    </g>
  </g>
  <!-- Benchmark badge -->
  <g transform="translate(280, 30)">
    <path d="M0,-25 L25,-10 L25,25 L0,35 L-25,25 L-25,-10 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Benchmark</text>
    <text x="0" y="20" text-anchor="middle" font-size="8" fill="#15803d">Above Industry Avg</text>
  </g>
</svg>