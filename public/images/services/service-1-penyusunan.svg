<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Document creation flow -->
  <g transform="translate(200, 60)">
    <!-- Steps -->
    <g font-size="9" fill="#1e293b" text-anchor="middle">
      <g transform="translate(-140, 0)">
        <circle cx="0" cy="0" r="25" fill="#3b82f6"/>
        <text x="0" y="4" font-size="12" font-weight="bold" fill="#fff">1</text>
        <text x="0" y="40" font-size="8">Kick-off</text>
        <text x="0" y="50" font-size="8">& Survey</text>
      </g>
      <g transform="translate(0, 0)">
        <path d="M15,0 L35,0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
        <path d="M40,-5 L50,0 L40,5" fill="#3b82f6"/>
      </g>
      <g transform="translate(60, 0)">
        <circle cx="0" cy="0" r="25" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
        <text x="0" y="4" font-size="12" font-weight="bold" fill="#3b82f6">2</text>
        <text x="0" y="40" font-size="8">Drafting</text>
        <text x="0" y="50" font-size="8">Dokumen</text>
      </g>
      <g transform="translate(140, 0)">
        <path d="M-40,-5 L-30,0 L-40,5" fill="#3b82f6"/>
        <path d="M-75,0 L-55,0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
        <circle cx="0" cy="0" r="25" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
        <text x="0" y="4" font-size="12" font-weight="bold" fill="#3b82f6">3</text>
        <text x="0" y="40" font-size="8">Review</text>
        <text x="0" y="50" font-size="8">& Revisi</text>
      </g>
      <g transform="translate(220, 0)">
        <path d="M-40,-5 L-30,0 L-40,5" fill="#3b82f6"/>
        <circle cx="0" cy="0" r="25" fill="#10b981"/>
        <text x="0" y="4" font-size="12" font-weight="bold" fill="#fff">4</text>
        <text x="0" y="40" font-size="8">Final</text>
        <text x="0" y="50" font-size="8">Handover</text>
      </g>
    </g>
  </g>
  <!-- Document stack -->
  <g transform="translate(200, 180)">
    <g transform="translate(-70, 30)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
      <rect x="10" y="8" width="120" height="12" rx="3" fill="#3b82f6"/>
      <text x="70" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">9 Elemen CSMS</text>
      <rect x="10" y="40" width="80" height="6" rx="2" fill="#93c5fd"/>
      <rect x="10" y="50" width="100" height="6" rx="2" fill="#dbeafe"/>
      <rect x="10" y="60" width="60" height="6" rx="2" fill="#dbeafe"/>
    </g>
    <g transform="translate(-60, 40)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#fff" stroke="#10b981" stroke-width="2"/>
      <rect x="10" y="8" width="120" height="12" rx="3" fill="#10b981"/>
      <text x="70" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Manual K3LL</text>
    </g>
    <g transform="translate(-50, 50)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
      <rect x="10" y="8" width="120" height="12" rx="3" fill="#f59e0b"/>
      <text x="70" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">POS/SWP</text>
    </g>
    <g transform="translate(-40, 60)">
      <rect x="0" y="0" width="140" height="80" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="10" y="8" width="120" height="12" rx="3" fill="#8b5cf6"/>
      <text x="70" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Forms & Register</text>
    </g>
  </g>
  <!-- Badge -->
  <g transform="translate(320, 40)">
    <path d="M0,-20 L18,-8 L18,18 L0,26 L-18,18 L-18,-8 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">100%</text>
    <text x="0" y="18" text-anchor="middle" font-size="8" fill="#92400e">Pass Rate</text>
  </g>
</svg>