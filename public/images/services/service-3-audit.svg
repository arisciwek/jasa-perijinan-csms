<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" />
  <!-- Audit timeline -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#1e293b">Audit Support Timeline</text>
    <g transform="translate(0, 25)">
      <!-- Pre-Audit -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="100" height="80" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
        <rect x="8" y="8" width="84" height="14" rx="3" fill="#3b82f6"/>
        <text x="50" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">PRE-AUDIT</text>
        <text x="50" y="30" text-anchor="middle" font-size="8" fill="#64748b">2-4 Minggu</text>
        <g transform="translate(10, 40)" font-size="7" fill="#1e293b">
          <text x="0" y="0">▸ Simulasi Audit</text>
          <text x="0" y="14">▸ Gap Closing</text>
          <text x="0" y="28">▸ Briefing Tim</text>
          <text x="0" y="42">▸ Evidence Prep</text>
        </g>
      </g>
      <g transform="translate(110, 0)">
        <path d="M0,40 L10,40" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
        <path d="M10,35 L20,40 L10,45" fill="#3b82f6"/>
      </g>
      <!-- During Audit -->
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="100" height="80" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
        <rect x="8" y="8" width="84" height="14" rx="3" fill="#f59e0b"/>
        <text x="50" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">DURING AUDIT</text>
        <text x="50" y="30" text-anchor="middle" font-size="8" fill="#64748b">Hari-H (3-5 hr)</text>
        <g transform="translate(10, 40)" font-size="7" fill="#1e293b">
          <text x="0" y="0">▸ Pendampingan TKP</text>
          <text x="0" y="14">▸ Clarifikasi Auditor</text>
          <text x="0" y="28">▸ Evidence Handover</text>
          <text x="0" y="42">▸ Real-time Notes</text>
        </g>
      </g>
      <g transform="translate(240, 0)">
        <path d="M0,40 L10,40" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
        <path d="M10,35 L20,40 L10,45" fill="#3b82f6"/>
      </g>
      <!-- Post-Audit -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="100" height="80" rx="6" fill="#fff" stroke="#10b981" stroke-width="2"/>
        <rect x="8" y="8" width="84" height="14" rx="3" fill="#10b981"/>
        <text x="50" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">POST-AUDIT</text>
        <text x="50" y="30" text-anchor="middle" font-size="8" fill="#64748b">Pasca-Audit</text>
        <g transform="translate(10, 40)" font-size="7" fill="#1e293b">
          <text x="0" y="0">▸ CAP Penyusunan</text>
          <text x="0" y="14">▸ Tracking Closed</text>
          <text x="0" y="28">▸ Verifikasi Efektivitas</text>
          <text x="0" y="42">▸ Lessons Learned</text>
        </g>
      </g>
    </g>
  </g>
  <!-- Auditor types -->
  <g transform="translate(50, 180)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1e293b">Jenis Audit yang Didukung</text>
    <g transform="translate(0, 20)">
      <g font-size="9" fill="#1e293b">
        <rect x="0" y="0" width="75" height="35" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
        <text x="37.5" y="15" text-anchor="middle" font-weight="bold" fill="#3b82f6">CSMS Verify</text>
        <text x="37.5" y="27" text-anchor="middle" font-size="7" fill="#64748b">Pertamina, Shell, BP</text>
      </g>
      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="75" height="35" rx="5" fill="#fff" stroke="#10b981" stroke-width="1"/>
        <text x="37.5" y="15" text-anchor="middle" font-weight="bold" fill="#10b981">SMK3</text>
        <text x="37.5" y="27" text-anchor="middle" font-size="7" fill="#64748b">Kemnaker RI</text>
      </g>
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="75" height="35" rx="5" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
        <text x="37.5" y="15" text-anchor="middle" font-weight="bold" fill="#f59e0b">ISO 45001</text>
        <text x="37.5" y="27" text-anchor="middle" font-size="7" fill="#64748b">LRQA, BSI, TUV</text>
      </g>
      <g transform="translate(255, 0)">
        <rect x="0" y="0" width="75" height="35" rx="5" fill="#fff" stroke="#8b5cf6" stroke-width="1"/>
        <text x="37.5" y="15" text-anchor="middle" font-weight="bold" fill="#8b5cf6">HSE Audit</text>
        <text x="37.5" y="27" text-anchor="middle" font-size="7" fill="#64748b">Project Owner</text>
      </g>
    </g>
  </g>
  <!-- Success badge -->
  <g transform="translate(280, 40)">
    <circle cx="35" cy="35" r="35" fill="#dcfce7"/>
    <circle cx="35" cy="35" r="25" fill="#16a34a"/>
    <text x="35" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">✓</text>
    <text x="35" y="85" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">100% Lolos</text>
    <text x="35" y="100" text-anchor="middle" font-size="8" fill="#15803d">Track Record</text>
  </g>
</svg>